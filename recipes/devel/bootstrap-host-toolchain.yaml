# This toolchain recipe basically does nothing. It's just here to declare the
# internal "host-toolchain" and "target-toolchain" tools and provide the usual
# variables. The user has to have gcc installed or things will go south.

provideTools:
    host-toolchain: "."
    target-toolchain:
        path: "."
        environment:
            # Default tool names.
            AR: "ar"
            AS: "as"
            CC: "gcc"
            CPP: "cpp"
            CXX: "g++"
            LD: "ld"
            NM: "nm"
            OBJCOPY: "objcopy"
            OBJDUMP: "objdump"
            RANLIB: "ranlib"
            READELF: "readelf"
            STRIP: "strip"

            # Fallback variables for recipes that cannot work with clang.
            GNU_CC: "gcc"
            GNU_CPP: "cpp"
            GNU_CXX: "g++"
            GNU_LD: "ld"

            # meta information
            ARCH: "${ARCH}"
            TOOLCHAIN_FLAVOUR: gcc
        fingerprintIf: True
        fingerprintScript: &fingerprint-script |
            bob-libc-version gcc
            bob-libstdc++-version g++

    host-compat-toolchain: &compat-toolchain
        path: "."
        environment:
            # Default tool names.
            AR: "ar"
            AS: "as"
            CC: "gcc"
            CPP: "cpp"
            CXX: "g++"
            LD: "ld"
            NM: "nm"
            OBJCOPY: "objcopy"
            OBJDUMP: "objdump"
            RANLIB: "ranlib"
            READELF: "readelf"
            STRIP: "strip"

            # Fallback variables for recipes that cannot work with clang.
            GNU_CC: "gcc"
            GNU_CPP: "cpp"
            GNU_CXX: "g++"
            GNU_LD: "ld"

            # meta information
            ARCH: "${ARCH}"
            TOOLCHAIN_FLAVOUR: gcc

            # Override compiler flags to mask active settings.
            #
            # Attention: keep in sync with default.yaml! These flags should be
            # reset exactly to their default values.
            CPPFLAGS:   ""
            CFLAGS:     "-O2 -pipe -fPIC"
            CXXFLAGS:   "-O2 -pipe -fPIC"
            LDFLAGS:    ""
        fingerprintIf: True
        fingerprintScript: *fingerprint-script

    host-native-toolchain: *compat-toolchain
